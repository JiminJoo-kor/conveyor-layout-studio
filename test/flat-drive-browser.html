<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flat Drive Physics Regression</title><style>body{font:14px system-ui;margin:24px;color:#172033}#result{font-weight:700}.pass{color:#087a42}.fail{color:#b42318}dl{display:grid;grid-template-columns:160px 1fr;max-width:560px;gap:8px;margin-top:20px}dt{color:#667085}dd{margin:0}</style></head><body><h1>Flat Drive Physics Regression</h1><p id="result">검증 중…</p><dl id="values"></dl><script type="module">
import {engineeringPreview,loadedPayloadFor} from '../src/auto-engineering.js';
const item={id:'cv-physical',type:'conveyor',parameters:{length:5.5,speed:20,capacity:4,autoMotionTuning:1}},load=loadedPayloadFor(item,100),preview=engineeringPreview(item,{payloadKg:load.payloadKg}),motion=preview.motions[0],motor=preview.motorSelection.motor,checks=[load.payloadKg===400,motion.massKg===480,motion.requestedSpeed===20,motion.appliedSpeed<20,motion.appliedSpeed<=2.5,motion.acceleration<=.8,motion.deceleration<=1,motion.peakSpeed<=motion.appliedSpeed,motor?.powerKw===1.5],pass=checks.every(Boolean),result=document.querySelector('#result');result.className=pass?'pass':'fail';result.textContent=`${pass?'PASS':'FAIL'} · 100kg × 4개 만재 · 요청 20.00m/s → 적용 ${motion.appliedSpeed.toFixed(2)}m/s · 실제 최고 ${motion.peakSpeed.toFixed(2)}m/s · IEC ${motor?.powerKw??'-'}kW`;
const rows=[['총 이동질량',`${motion.massKg.toFixed(1)} kg`],['가속',`${motion.acceleration.toFixed(2)} m/s² · ${motion.accelerationTime.toFixed(2)}초 · ${motion.accelerationDistance.toFixed(2)}m`],['정속',`${motion.cruiseTime.toFixed(2)}초 · ${motion.cruiseDistance.toFixed(2)}m`],['감속',`${motion.deceleration.toFixed(2)} m/s² · ${motion.decelerationTime.toFixed(2)}초 · ${motion.decelerationDistance.toFixed(2)}m`],['총 이동시간',`${motion.totalTime.toFixed(2)}초`],['속도 제한',motion.limitReasons.join(' · ')],['필요 토크',`${preview.motorSelection.requirements.motorTorqueNm.toFixed(2)} Nm`],['필요 동력',`${preview.motorSelection.requirements.powerKw.toFixed(3)} kW`]];document.querySelector('#values').innerHTML=rows.map(([key,value])=>`<dt>${key}</dt><dd>${value}</dd>`).join('');
</script></body></html>
