<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JSON 기반 컨베이어 레이아웃 시뮬레이션 스튜디오"><title>Conveyor Layout Studio</title><link rel="stylesheet" href="./styles.css"></head>
<body><header class="topbar"><div><span class="eyebrow">DIGITAL FLOW LAB</span><h1>Conveyor Layout Studio</h1></div><div class="layout-meta"><span>LAYOUT</span><strong id="layoutName">-</strong><span id="simTime">00:00</span></div></header>
<main class="workspace"><aside class="controls">
<section><h2>투입 설정</h2><label class="check"><input id="useA" type="checkbox"> A 트레이 사용 <small>4개</small></label><label>A 투입 간격 <span><input id="injectA" type="number" min="1">초</span></label><label class="check"><input id="useB" type="checkbox"> B 트레이 사용 <small>1개</small></label><label>B 투입 간격 <span><input id="injectB" type="number" min="1">초</span></label><label>C 투입 간격 <span><input id="injectC" type="number" min="1">초</span></label></section>
<section><h2>설비 속도</h2><label>2번 컨베이어 <span><input id="conv2Speed" type="number" min=".01" step=".1">초/칸</span></label><label>1번 컨베이어 <span><input id="conv1Speed" type="number" min=".01" step=".1">초/칸</span></label><label>PICK <span><input id="pickTime" type="number" min="0" step=".1">초</span></label><label>PLACE <span><input id="placeTime" type="number" min="0" step=".1">초</span></label></section>
<section><h2>후공정</h2><label>1-5 작업 <span><input id="station15Time" type="number" min="0">초</span></label><label>1-6 작업 <span><input id="station16Time" type="number" min="0">초</span></label><label>1-7 지게차 <span><input id="forklift17Time" type="number" min=".01">초</span></label><label>2-11 지게차 <span><input id="forklift211Time" type="number" min=".01">초</span></label></section>
<section><h2>실행</h2><label>총 시간 <span><input id="simDuration" type="number" min="1">초</span></label><label>재생 속도 <span><input id="playback" type="range" min="1" max="50" value="10"></span></label></section><p id="validation" class="validation" role="alert"></p><div class="actions"><button id="runBtn" class="primary">시뮬레이션 시작</button><button id="resetBtn">초기화</button></div></aside>
<section class="stage"><div class="kpis"><article><span>1-7 처리량</span><strong id="throughput">0.0/h</strong></article><article><span>로봇 가동률</span><strong id="robotUtil">0.0%</strong></article><article><span>현재 WIP</span><strong id="wip">0</strong></article><article><span>추정 병목</span><strong id="bottleneck" class="warn">-</strong></article></div>
<section class="canvas-card"><div class="section-head"><div><span class="eyebrow">DXF-DRIVEN LAYOUT</span><h2>공정 레이아웃</h2></div><div class="layout-actions"><label class="file-button cad-button">DXF 분석<input id="cadFile" type="file" accept=".dxf,application/dxf"></label><button id="editorToggle">편집 모드</button><label class="file-button">참조 이미지<input id="drawingFile" type="file" accept="image/*"></label><label class="file-button">JSON 불러오기<input id="layoutFile" type="file" accept="application/json,.json"></label><button id="exportLayout">JSON 저장</button></div></div><div id="cadStatus" class="cad-status" hidden><strong id="cadStatusTitle">CAD 분석 준비</strong><span id="cadStatusText"></span><div id="cadCandidates" class="candidate-list"></div></div><div id="editorTools" class="editor-tools" hidden><div class="palette"><span>설비 추가</span><button data-add="conveyor">컨베이어</button><button data-add="diverter">디버터</button><button data-add="shuttle">셔틀</button><button data-add="agv">AGV</button><button data-add="amr">AMR</button><button data-add="robot">로봇</button><button data-add="station">스테이션</button><button data-add="forklift">지게차</button><button id="resetView">화면 맞춤</button></div><div class="property-panel"><label>선택 설비 <input id="propName" placeholder="설비를 선택하세요" disabled></label><label>X <input id="propX" type="number" step="10" disabled></label><label>Y <input id="propY" type="number" step="10" disabled></label><button id="deleteEquipment" disabled>선택 삭제</button></div><p>드래그: 설비 이동 · 휠: 확대/축소 · Shift+드래그: 화면 이동</p></div><div class="canvas-scroll"><canvas id="layoutCanvas"></canvas></div></section>
<div class="lower-grid"><section class="summary"><h2>생산 요약</h2><div><span>이동 물품</span><strong id="moved">0</strong></div><div><span>완료 C 트레이</span><strong id="completed">0</strong></div></section><section class="events"><h2>최근 이벤트</h2><div class="table-wrap"><table><thead><tr><th>시간</th><th>이벤트</th><th>설비/종류</th><th>트레이</th></tr></thead><tbody id="eventRows"></tbody></table></div></section></div></section></main><script type="module" src="./src/app.js"></script></body></html>
